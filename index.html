<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Сімейний помічник</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-slate-800">
  <div class="max-w-[480px] mx-auto min-h-screen bg-slate-50 flex flex-col relative pb-20 shadow-xl border-x border-slate-200">
    
    <!-- Шапка -->
    <header class="bg-white px-4 py-3.5 border-b border-slate-200 sticky top-0 z-30 flex justify-between items-center shadow-sm">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-sm">
          <i data-lucide="calendar-heart" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-bold text-base leading-tight text-slate-900">Сімейний помічник</h1>
          <p class="text-[11px] text-slate-500 font-medium">Зміни • Планер • Покупки</p>
        </div>
      </div>
      <button onclick="openBackupModal()" class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 active:scale-95 transition">
        <i data-lucide="settings" class="w-5 h-5"></i>
      </button>
    </header>

    <!-- Контент вкладок -->
    <main class="flex-1 p-3.5 space-y-4">
      
      <!-- ВКЛАДКА 1: ГРАФІК ЗМІН -->
      <section id="tab-shifts" class="space-y-3.5">
        
        <!-- Члени сім'ї та фільтр -->
        <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Члени сім'ї (фільтр)</span>
            <button onclick="openUsersModal()" class="text-xs font-semibold text-blue-600 flex items-center gap-1 hover:underline">
              <i data-lucide="user-plus" class="w-3.5 h-3.5"></i> Налаштувати
            </button>
          </div>
          <div id="user-filters" class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1"></div>
        </div>

        <!-- Режими роботи з календарем -->
        <div class="bg-white p-2.5 rounded-2xl shadow-sm border border-slate-100">
          <div class="grid grid-cols-2 gap-1.5 bg-slate-100 p-1 rounded-xl">
            <button id="mode-view-btn" onclick="setCalendarMode('view')" class="py-2 px-3 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1.5 bg-white text-slate-900 shadow-sm">
              <i data-lucide="eye" class="w-4 h-4"></i> Деталі дня
            </button>
            <button id="mode-stamp-btn" onclick="setCalendarMode('stamp')" class="py-2 px-3 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1.5 text-slate-600">
              <i data-lucide="zap" class="w-4 h-4"></i> Швидкий штамп
            </button>
          </div>

          <!-- Панель швидкого штампу -->
          <div id="stamp-controls" class="hidden mt-3 pt-2.5 border-t border-slate-100 space-y-2.5">
            <p class="text-[11px] text-slate-500 font-medium">Обери людину та статус, а потім просто натискай на числа в календарі:</p>
            <div id="stamp-users" class="flex gap-1.5 overflow-x-auto no-scrollbar"></div>
            <div id="stamp-statuses" class="grid grid-cols-4 gap-1.5"></div>
          </div>
        </div>

        <!-- Календар -->
        <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100">
          <div class="flex justify-between items-center mb-3">
            <div class="flex items-center gap-1">
              <button onclick="changeMonth(-1)" class="p-2 rounded-xl hover:bg-slate-100 active:scale-95">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
              </button>
              <h2 id="calendar-month-title" class="font-bold text-base min-w-[130px] text-center capitalize"></h2>
              <button onclick="changeMonth(1)" class="p-2 rounded-xl hover:bg-slate-100 active:scale-95">
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
              </button>
            </div>
            <button onclick="goToToday()" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-blue-50 text-blue-600 active:scale-95">
              Сьогодні
            </button>
          </div>

          <!-- Дні тижня -->
          <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-400 mb-1.5">
            <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div>
            <div class="text-rose-400">Сб</div><div class="text-rose-400">Нд</div>
          </div>

          <!-- Сітка днів -->
          <div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>

          <!-- Легенда -->
          <div class="mt-3 pt-2.5 border-t border-slate-100 flex flex-wrap gap-3 justify-center text-[11px] text-slate-500">
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-slate-800 inline-block"></span> Робота</span>
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full border-2 border-slate-500 inline-block"></span> Вихідний</span>
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bg-amber-500 inline-block"></span> Чергування</span>
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span> Відпустка</span>
          </div>
        </div>
      </section>

      <!-- ВКЛАДКА 2: ПЛАНЕР ПОДІЙ -->
      <section id="tab-planner" class="hidden space-y-3.5">
        <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 space-y-3">
          <div class="flex justify-between items-center gap-2">
            <input type="date" id="planner-date" onchange="renderPlanner()" class="px-3 py-2 rounded-xl border border-slate-200 text-sm font-semibold bg-slate-50 flex-1">
            <div class="flex bg-slate-100 p-1 rounded-xl">
              <button id="plan-filter-day" onclick="setPlannerFilter('day')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white shadow-sm">День</button>
              <button id="plan-filter-all" onclick="setPlannerFilter('all')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600">Усі</button>
            </div>
          </div>

          <!-- Форма додавання події -->
          <form onsubmit="addEvent(event)" class="space-y-2.5 pt-2 border-t border-slate-100">
            <input type="text" id="event-title" required placeholder="Що потрібно зробити?" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-500">
            <div class="grid grid-cols-3 gap-2">
              <input type="time" id="event-time" class="px-2.5 py-2 rounded-xl border border-slate-200 text-xs bg-slate-50">
              <select id="event-user" class="px-2.5 py-2 rounded-xl border border-slate-200 text-xs bg-slate-50"></select>
              <select id="event-priority" class="px-2.5 py-2 rounded-xl border border-slate-200 text-xs bg-slate-50">
                <option value="normal">Звичайно</option>
                <option value="high">❗ Важливо</option>
              </select>
            </div>
            <input type="text" id="event-note" placeholder="Коротка нотатка (необов'язково)" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-blue-500">
            <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm active:scale-98 transition flex items-center justify-center gap-1.5">
              <i data-lucide="plus-circle" class="w-4 h-4"></i> Додати подію
            </button>
          </form>
        </div>

        <div id="events-list" class="space-y-2"></div>
      </section>

      <!-- ВКЛАДКА 3: ПОКУПКИ -->
      <section id="tab-shopping" class="hidden space-y-3.5">
        <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 space-y-3">
          <form onsubmit="addShoppingItem(event)" class="space-y-2.5">
            <div class="flex gap-2">
              <input type="text" id="shop-title" required placeholder="Що купити? (напр. Молоко)" class="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-500">
              <input type="text" id="shop-qty" placeholder="К-сть" class="w-20 px-2.5 py-2.5 rounded-xl border border-slate-200 text-sm text-center focus:outline-none focus:border-blue-500">
            </div>
            <div id="shop-cat-selector" class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1"></div>
            <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-sm active:scale-98 transition flex items-center justify-center gap-1.5">
              <i data-lucide="shopping-bag" class="w-4 h-4"></i> Додати в список
            </button>
          </form>
        </div>

        <div class="flex justify-between items-center px-1">
          <span id="shop-counter" class="text-xs font-bold text-slate-500"></span>
          <button onclick="clearBoughtItems()" class="text-xs font-semibold text-rose-600 hover:underline flex items-center gap-1">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Очистити куплене
          </button>
        </div>

        <div id="shop-filter-tabs" class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1"></div>
        <div id="shopping-list" class="space-y-3"></div>
      </section>

    </main>

    <!-- Нижня навігація -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-white border-t border-slate-200 grid grid-cols-3 py-1.5 px-2 z-30 shadow-lg">
      <button onclick="switchTab('shifts')" id="nav-shifts" class="flex flex-col items-center py-1.5 rounded-xl text-blue-600 font-semibold">
        <i data-lucide="calendar" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[11px]">Графік змін</span>
      </button>
      <button onclick="switchTab('planner')" id="nav-planner" class="flex flex-col items-center py-1.5 rounded-xl text-slate-400 font-medium">
        <i data-lucide="check-square" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[11px]">Планер</span>
      </button>
      <button onclick="switchTab('shopping')" id="nav-shopping" class="flex flex-col items-center py-1.5 rounded-xl text-slate-400 font-medium">
        <i data-lucide="shopping-cart" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[11px]">Покупки</span>
      </button>
    </nav>

    <!-- Модальне вікно деталей дня -->
    <div id="day-modal" class="fixed inset-0 bg-black/5
